# Publica o GCM Ponto no GitHub Pages a cada commit na branch main.
#
# Não há painel, não há créditos, não há pausa por uso: o próprio GitHub
# compila e publica. Cada vez que um arquivo muda, o app novo entra no ar
# em cerca de dois minutos.

name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # permite publicar na mão pelo botão "Run workflow"

permissions:
  contents: read
  pages: write
  id-token: write

# Se dois commits vierem juntos, o mais novo vence e o antigo é descartado.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Conferir as regras de cálculo
        run: npm run teste

      - name: Compilar
        run: npm run build

      - name: Empacotar para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
